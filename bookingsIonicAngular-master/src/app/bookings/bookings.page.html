<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/places/tabs/discover"></ion-back-button>
    </ion-buttons>
    <ion-title>Bookings</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-grid>
    <ion-row>

      <ion-col size="12" class="ion-text-center" *ngIf="isLoading" style="padding:18px">
        <ion-spinner color="primary"></ion-spinner>
      </ion-col>

      <ion-col class="ion-text-center" sizeMd="6" offsetMd="3"
        *ngIf="!isLoading && (!loadedBookings || loadedBookings.length <= 0)">
        <p>No bookings found!</p>
      </ion-col>

      <ion-col sizeMd="6" offsetMd="3" *ngIf="!isLoading && loadedBookings && loadedBookings.length > 0">
        <ion-list>

          <ion-item-sliding
            *ngFor="let booking of loadedBookings; trackBy: trackByBookingId"
            #slidingItem
          >

            <ion-item button (click)="openBookingDetails(booking)">
              <ion-avatar slot="start">
                <ion-img [src]="getImageUrl(booking.placeImage)"></ion-img>
              </ion-avatar>

              <ion-label>
                <h2>{{ booking.placeTitle }}</h2>

                <p *ngIf="booking.ownerPhone">Owner phone: {{ booking.ownerPhone }}</p>
              </ion-label>
            </ion-item>

            <ion-item-options side="end">
              <ion-item-option color="danger" (click)="onCancelBooking(booking.id, slidingItem)">
                <ion-icon name="trash" slot="icon-only"></ion-icon>
              </ion-item-option>
            </ion-item-options>

          </ion-item-sliding>

        </ion-list>
      </ion-col>

    </ion-row>
  </ion-grid>
</ion-content>
