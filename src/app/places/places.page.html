<ion-menu contentId="main-content">
  <ion-header>
    <ion-toolbar>
      <ion-title>
        Booking
      </ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-content>
    <ion-list>
      <ion-menu-toggle>

        <ion-item
          *ngIf="!isLoggedIn()"
          lines="none"
          routerLink="/auth">
          <ion-icon name="log-in" slot="start"></ion-icon>
          <ion-label>Log in</ion-label>
        </ion-item>

        <ion-item
          *ngIf="isLoggedIn()"
          lines="none"
          routerLink="/places/tabs/discover">
          <ion-icon name="bussiness" slot="start"></ion-icon>
          <ion-label>Discover Places</ion-label>
        </ion-item>

        <ion-item
          *ngIf="isLoggedIn()"
          lines="none"
          routerLink="/bookings">
          <ion-icon name="checkbox-outline" slot="start"></ion-icon>
          <ion-label>Your Bookings</ion-label>
        </ion-item>

        <ion-item
          *ngIf="isLoggedIn()"
          lines="none"
          (click)="onLogout()"
          button>
          <ion-icon name="exit" slot="start"></ion-icon>
          <ion-label>Log out</ion-label>
        </ion-item>

      </ion-menu-toggle>
    </ion-list>
  </ion-content>
</ion-menu>


<ion-tabs>
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="discover">
      <ion-label>Discover</ion-label>
      <ion-icon name="search"></ion-icon>
    </ion-tab-button>
    <ion-tab-button tab="offers" *ngIf="authService.isLoggedIn()">
       <ion-label>Offers</ion-label>
      <ion-icon name="card"></ion-icon>
    </ion-tab-button>
   </ion-tab-bar>
</ion-tabs>
