<div class="ion-page">
  <ion-header [translucent]="true">
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-menu-button></ion-menu-button>
      </ion-buttons>
      <ion-title>My offers</ion-title>
      <ion-buttons slot="primary">
        <ion-button routerLink="/places/tabs/offers/new-offer">
          <ion-icon name="add" slot="icon-only"></ion-icon>
        </ion-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>

  <ion-content [fullscreen]="true">
    <ion-grid>
      <ion-row>
        <ion-col size="12" sizeSm="8" offsetSm="2">

          <div *ngIf="isLoading" class="ion-text-center">
            <ion-spinner></ion-spinner>
          </div>

          <p class="ion-text-center" *ngIf="!isLoading && (!offers || offers.length <= 0)">
            No offers found! Please create one first
          </p>

          <ion-list *ngIf="!isLoading && offers && offers.length > 0">
            <ion-item-sliding *ngFor="let offer of offers; trackBy: trackByOfferId" #slidingItem>

              <ion-item>
                <ion-thumbnail slot="start">
                  <ion-img [src]="getImageUrl(getCoverUrl(offer))"></ion-img>
                </ion-thumbnail>

                <ion-label>
                  <h2>{{ offer.title }}</h2>
                  <div class="offer-details">
                    <ion-icon name="calendar"></ion-icon>
                    <ion-text color="primary" class="space-left">{{ offer.avaiableFrom | date }}</ion-text>
                    <span class="space-left">to</span>
                    <ion-icon name="calendar"></ion-icon>
                    <ion-text color="primary" class="space-left">{{ offer.avaiableTo | date }}</ion-text>
                  </div>
                </ion-label>
              </ion-item>

              <ion-item-options side="end">
                <ion-item-option color="secondary" [routerLink]="['/','places','tabs','offers','edit',offer.id]">
                  <ion-icon name="create" slot="icon-only"></ion-icon>
                </ion-item-option>

                <ion-item-option color="danger" (click)="onDelete(offer.id!, slidingItem)">
                  <ion-icon name="trash" slot="icon-only"></ion-icon>
                </ion-item-option>
              </ion-item-options>

            </ion-item-sliding>
          </ion-list>

        </ion-col>
      </ion-row>
    </ion-grid>
  </ion-content>
</div>
